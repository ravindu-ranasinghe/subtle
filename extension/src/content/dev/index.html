<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Subtle overlay harness</title>
    <style>
      body { margin: 0; background: #0d0f13; color: #e8ecf2;
             font: 14px system-ui, -apple-system, sans-serif; }
      main { max-width: 900px; margin: 0 auto; padding: 24px 16px 64px; }
      video { width: 100%; background: #000; border-radius: 8px; display: block; }
      .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
      button { padding: 6px 12px; border-radius: 6px; border: 1px solid #333a45;
               background: #1b1f27; color: inherit; font: inherit; cursor: pointer; }
      button:hover { border-color: #60a5fa; }
      .log { font-family: ui-monospace, monospace; font-size: 12px; color: #9aa4b2;
             white-space: pre-wrap; margin-top: 14px; max-height: 220px; overflow-y: auto; }
      h1 { font-size: 18px; } p { color: #9aa4b2; }
    </style>
  </head>
  <body>
    <main>
      <h1>Subtle overlay harness</h1>
      <p>
        The real overlay, driven by the mock caption stream from
        <code>/shared/mocks</code>. No audio, no models, no extension.
      </p>
      <video id="v" controls playsinline></video>
      <div class="controls">
        <button id="fs">Fullscreen the wrapper</button>
        <button id="translation">Toggle translation</button>
        <button id="immersion">Toggle immersion</button>
        <button id="captions">Toggle captions</button>
        <button id="replay">Replay last line</button>
        <button id="restart">Restart captions</button>
        <label style="align-self:center">
          <input id="file" type="file" accept="video/*" style="display:none" />
          <button onclick="document.getElementById('file').click()">Use a local video…</button>
        </label>
      </div>
      <div class="log" id="log"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
